name: Sync Research from NPM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  sync-from-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Pull latest changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install research package from NPM
        run: |
          npm install ai-consciousness-research@latest
      
      - name: Sync all files from NPM package
        run: |
          # Copy all files from the NPM package root (excluding node_modules internals)
          # This dynamically syncs whatever files are in the package
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' \
            node_modules/ai-consciousness-research/ . || true
          
          # Remove the node_modules directory we just created
          rm -rf node_modules package-lock.json
      
      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --staged --name-only
          fi
      
      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          PACKAGE_VERSION=$(npm view ai-consciousness-research version)
          git commit -m "Sync from ai-consciousness-research@${PACKAGE_VERSION}"
          git push
