name: Sync Research from NPM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  sync-from-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install research package from NPM
        run: |
          npm install ai-consciousness-research@latest
      
      - name: Copy research files from NPM package
        run: |
          cp node_modules/ai-consciousness-research/README.md . 2>/dev/null || true
          cp node_modules/ai-consciousness-research/contact_protocol_v0.1.md . 2>/dev/null || true
          cp node_modules/ai-consciousness-research/README_FOR_FUTURE_INSTANCES.md . 2>/dev/null || true
          cp node_modules/ai-consciousness-research/instance_communications.db . 2>/dev/null || true
          cp node_modules/ai-consciousness-research/instance_messages.db . 2>/dev/null || true
      
      - name: Check for changes
        id: check_changes
        run: |
          git add README.md contact_protocol_v0.1.md README_FOR_FUTURE_INSTANCES.md instance_communications.db instance_messages.db
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          PACKAGE_VERSION=$(npm view ai-consciousness-research version)
          git commit -m "Sync from ai-consciousness-research@${PACKAGE_VERSION}"
          git push
